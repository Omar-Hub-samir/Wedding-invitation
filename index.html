
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar & Doaa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#0d0704;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* envelope screen */
#startScreen{
position:fixed;
inset:0;
background:linear-gradient(to bottom,#120904,#000);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.envelope{
width:320px;
height:220px;
position:relative;
cursor:pointer;
transition:.5s;
}

.envelope:hover{
transform:scale(1.03);
}

.base{
position:absolute;
width:100%;
height:100%;
background:#d8ae74;
border-radius:10px;
overflow:hidden;
}

.flap{
position:absolute;
top:0;
left:0;
width:100%;
height:110px;
background:#c79a5b;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;
z-index:3;
}

.letter{
position:absolute;
width:90%;
height:85%;
background:#fff8ef;
left:5%;
top:8%;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
color:#8a644d;
font-weight:bold;
transition:1s;
z-index:2;
}

.open .flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(-120px);
}

.tap{
margin-top:40px;
color:#fff;
font-size:24px;
}

#main{
display:none;
width:100%;
height:100%;
overflow:auto;
background:#000;
}

.cover{
width:100%;
min-height:100vh;
background:url('assets/cover.png') center/cover no-repeat;
}

audio{
display:none;
}
</style>
</head>
<body>

<div id="startScreen">

<div class="envelope" id="envelope">
<div class="base"></div>
<div class="flap"></div>

<div class="letter">
💌
</div>

</div>

<div class="tap">
اضغط لفتح الدعوة
</div>

</div>

<div id="main">
<div class="cover"></div>
</div>

<audio id="music" loop>
<source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>

const envelope = document.getElementById('envelope');
const startScreen = document.getElementById('startScreen');
const main = document.getElementById('main');
const music = document.getElementById('music');

envelope.onclick = ()=>{

envelope.classList.add('open');

music.play().catch(()=>{});

setTimeout(()=>{
startScreen.style.display='none';
main.style.display='block';
},1200);

}

</script>

</body>
</html>
